[project]
name = "qitv"
version = "1.13.7"
description = "A cross-platform STB and IPTV player client"
# Qt and the theme package currently support Python 3.14, but not 3.15.
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp[speedups]>=3.14.3",
    "mpv>=1.0.8",
    "orjson>=3.12.0",
    "packaging>=26.3",
    "pyqtdarktheme-fork>=2.3.6",
    "pyside6>=6.11.2",
    "python-vlc==3.0.21203",
    "requests>=2.34.2",
    "tzlocal>=5.4.4",
    "urllib3>=2.8.0",
    "urlobject>=3.0.0",
]

[tool.black]
line-length = 100
target-version = ["py314"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true
force_sort_within_sections = true

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true
strict_equality = true
plugins = []
# PySide6 stubs are incomplete for Python 3.14 — enum members (Qt.UserRole,
# QMessageBox.Yes, etc.) and widget attributes are not recognised.
# Only disable error codes that are directly caused by broken stubs.
disable_error_code = ["attr-defined", "call-overload", "union-attr"]

# Mixin classes use stub method bodies (``def foo(self): ...``) to declare
# the interface that the concrete host class provides at runtime.
[[tool.mypy.overrides]]
module = "mixins.*"
disable_error_code = ["empty-body"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203"]
select = ["E9", "F63", "F7", "F82"]

# Developer tools used in CI and locally
[dependency-groups]
dev = [
  "pyinstaller>=6.22.3",
  "black==26.5.1",
  "isort==9.0.1",
  "mypy==2.3.1",
  "flake8==7.3.0",
  "types-requests==2.33.0.20260906",
]
