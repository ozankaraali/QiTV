repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files
    -   id: check-merge-conflict
-   repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
    -   id: black
        name: Black Linter
        exclude: ^.*\b(migrations)\b.*$
-   repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
    -   id: flake8
        name: Flake8 syntax errors or undefined names
        exclude: ^.*\b(migrations)\b.*$
        args: [--count, "--select=E9,F63,F7,F82", --show-source, --statistics]
    -   id: flake8
        # As black writes (100 columns; E203 is black's slice spacing) and as the tests set their
        # path before importing (E402): what is left is real, plus complexity notes.
        name: Flake8 exit-zero treats all errors as warnings
        exclude: ^.*\b(migrations)\b.*$
        args: [--count, --exit-zero, --max-complexity=10, --max-line-length=100, "--extend-ignore=E203,E402", --statistics]
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.4.0'
    hooks:
    -   id: mypy
        additional_dependencies:
              - types-requests==2.33.0.20260906
        exclude: ^.*\b(migrations)\b.*$
-   repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files"]
