# QiTV-managed uosc menu. Updates are delivered with QiTV, never by uosc.
# Explicitly loaded with --input-conf so no personal mpv bindings are read.
MBTN_RIGHT script-binding uosc/menu
MENU script-binding uosc/menu
# script-binding uosc/subtitles #! Subtitles
# script-binding uosc/audio #! Audio tracks
# script-binding uosc/video #! Video tracks
# script-binding uosc/items #! Playlist
# script-binding uosc/chapters #! Chapters
# script-binding uosc/next #! Navigation > Next
# script-binding uosc/prev #! Navigation > Prev
# script-binding uosc/open-file #! Navigation > Open file
# set video-aspect-override "-1" #! Playback > Aspect ratio > Default
# set video-aspect-override "16:9" #! Playback > Aspect ratio > 16:9
# set video-aspect-override "4:3" #! Playback > Aspect ratio > 4:3
# set video-aspect-override "2.35:1" #! Playback > Aspect ratio > 2.35:1
# script-binding uosc/audio-device #! Playback > Audio devices
# script-binding uosc/editions #! Playback > Editions
# cycle ontop #! Playback > Always on top
# script-binding uosc/keybinds #! Key bindings
# quit #! Close player
