name: Probe native overlays from existing artifacts

on:
  push:
    branches: [verify/bundled-mpv]
    paths: [.github/workflows/mpv-render-probe.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-22.04
            asset: qitv-linux
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
      PROBE_ASSET: ${{ matrix.asset }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install Linux display runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxcb-cursor0 libxpresent1 libxss1 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 \
            libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libx11-xcb1
      - name: Prepare Python and download the existing native binary
        run: |
          uv sync --frozen --dev
          gh run download 35474154424 --name packaged-app-${{ matrix.name }} --dir probe
      - name: Extract the unchanged native runtime from the existing app
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            ditto -x -k "probe/$PROBE_ASSET" probe
          fi
          uv run --frozen --no-sync python - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader
          if sys.platform == 'darwin':
              shutil.copytree('probe/QiTV.app/Contents/Resources/native/mpv', 'native/mpv')
          else:
              archive = CArchiveReader(str(Path('probe') / os.environ['PROBE_ASSET']))
              for member in archive.toc:
                  name = member.replace('\\', '/')
                  if name.startswith('native/mpv/'):
                      destination = Path(name)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(archive.extract(member))
          if sys.platform != 'win32':
              for name in ('mpv', 'ziggy'):
                  (Path('native/mpv/bin') / name).chmod(0o755)
          PY
      - name: Verify native video and visible controls
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=xcb xvfb-run -a uv run --frozen --no-sync python scripts/smoke_mpv.py \
              --render --fixture tests/fixtures/mpv-smoke.mp4 --report build/mpv-probe/render.json
          else
            uv run --frozen --no-sync python scripts/smoke_mpv.py \
              --render --fixture tests/fixtures/mpv-smoke.mp4 --report build/mpv-probe/render.json
          fi
      - name: Upload the rendered result and native log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-overlay-${{ matrix.name }}
          path: build/mpv-probe/
          if-no-files-found: error
