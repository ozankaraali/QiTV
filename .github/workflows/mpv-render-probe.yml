name: Probe macOS software rendering

on:
  push:
    branches: [verify/bundled-mpv]
    paths: [.github/workflows/mpv-render-probe.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download the existing experimental ARM app
        run: gh run download 35474154424 --name packaged-app-macos-arm64 --dir probe
      - name: Apply the fast profile to this diagnostic copy only
        run: |
          ditto -x -k probe/qitv-macos-arm64.zip probe
          python3 - <<'PY'
          from pathlib import Path
          script = Path('probe/QiTV.app/Contents/Resources/assets/mpv/qitv.lua')
          script.write_text('mp.commandv("apply-profile", "fast")\n' + script.read_text())
          PY
          codesign --force --deep --sign - probe/QiTV.app
      - name: Exercise the frozen app outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/probe/QiTV.app/Contents/MacOS/QiTV" --smoke-mpv --render \
            --fixture "$GITHUB_WORKSPACE/tests/fixtures/mpv-smoke.mp4" \
            --report "$GITHUB_WORKSPACE/build/mpv-probe/fast.json"
      - name: Upload the rendered result and native log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: software-render-probe
          path: build/mpv-probe/
          if-no-files-found: error
