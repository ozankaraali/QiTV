name: Build and verify

# Pushes to main release; tv/vlc is checked on demand (Actions → Run workflow). A commit pushed
# to both gave two runs, and GitHub showed both runs' checks on main's commit.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer manual check replaces a running one; a release from main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: write  # a failed job cancels the run

jobs:
  # The unit tests run once, on macOS, beside the builds (2.6.1: Ubuntu's package mirror kept
  # stalling the VLC install; VLC.app comes from the build jobs' cache); each build still
  # smoke-tests its packaged app (real playback with the bundled libVLC) on its own platform.
  tests:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Get latest VLC version
        id: vlc-version
        run: |
          VLC_VERSION=$(brew info --json=v2 --cask vlc | python3 -c "import sys,json; print(json.load(sys.stdin)['casks'][0]['version'])")
          echo "version=$VLC_VERSION" >> $GITHUB_OUTPUT
      - name: Cache VLC.app
        id: vlc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Applications/VLC.app
          key: vlc-macos-arm64-${{ steps.vlc-version.outputs.version }}
      - name: Install VLC
        if: steps.vlc-cache.outputs.cache-hit != 'true'
        run: brew install --cask vlc
      - name: Sync dependencies
        run: uv sync --frozen --dev
      - name: Run tests
        timeout-minutes: 15
        run: uv run python scripts/run_tests.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Cancel the run after a failure
        # A failed job cancels the others: the run cannot release anyway, and a fix pushed
        # next does not wait for it (main's runs queue instead of replacing each other).
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux:
    # Pinned: ubuntu-latest moves to 26.04 from 2026-10-19, and a build on a newer glibc
    # would not start on older distributions.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install VLC and xcb dependencies
        timeout-minutes: 6  # a stalled mirror (see the tests job)
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $apt update
          sudo apt-get $apt install -y vlc libxcb-cursor0 xvfb openbox xcompmgr x11-utils
      - name: Silence ALSA
        run: |
          printf 'pcm.!default { type null }\n' > ~/.asoundrc
      - name: Sync dependencies
        id: sync
        run: uv sync --frozen --dev
      - name: Write the build's keys
        # services/_build_keys.py gets the OpenSubtitles key and the TMDB token from the
        # secrets, never printed; without a secret (a fork) its key stays empty. Nothing here
        # commits them.
        run: uv run python scripts/write_build_keys.py
        env:
          QITV_OPENSUBTITLES_KEY: ${{ secrets.QITV_OPENSUBTITLES_KEY }}
          QITV_TMDB_TOKEN: ${{ secrets.QITV_TMDB_TOKEN }}
      - name: Package App with PyInstaller for Linux
        id: package
        run: uv run pyinstaller qitv-linux.spec
      - name: Rename binary
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: mv dist/qitv dist/qitv-linux
      - name: Hide the system VLC from the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # The app ships its own libVLC: its smoke must pass with no VLC installed. The apt
        # packages' libvlc, libvlccore and plugin directory move aside until the restore.
        run: |
          set -eu
          hidden="$RUNNER_TEMP/system-vlc"
          mkdir -p "$hidden/lib"
          dpkg -L libvlc5 libvlccore9 | grep -E '/libvlc(core)?\.so\.[0-9.]+$' > "$hidden/paths"
          while read -r lib; do sudo mv "$lib" "$hidden/lib/"; done < "$hidden/paths"
          dpkg -L vlc-plugin-base | grep -m1 -E '/vlc/plugins$' > "$hidden/plugins-path"
          sudo mv "$(cat "$hidden/plugins-path")" "$hidden/plugins"
          echo "Hidden:"; cat "$hidden/paths" "$hidden/plugins-path"
          if python3 -c "import ctypes; ctypes.CDLL('libvlc.so.5')" 2>/dev/null; then
            echo "::error::the system libVLC still loads"; exit 1
          fi
      - name: Smoke test the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # The same scenario through main.py's --smoke entry: the live helper must spawn from
        # the bundle. The fixtures come from the checkout; the app has none.
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" sh -c '
            openbox &
            xcompmgr &
            for i in $(seq 50); do
              xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id" && break
              sleep 0.2
            done
            if ! xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then
              echo "openbox did not start"
              exit 1
            fi
            dist/qitv-linux --smoke --out smoke-frozen --pipeline --pip --fixtures tests/fixtures
          '
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: xcb
          QITV_SMOKE: '1'
      - name: Restore the system VLC
        if: always()
        run: |
          hidden="$RUNNER_TEMP/system-vlc"
          if [ -f "$hidden/paths" ]; then
            while read -r lib; do
              moved="$hidden/lib/$(basename "$lib")"
              if [ -e "$moved" ] || [ -L "$moved" ]; then sudo mv "$moved" "$lib"; fi
            done < "$hidden/paths"
          fi
          if [ -d "$hidden/plugins" ]; then sudo mv "$hidden/plugins" "$(cat "$hidden/plugins-path")"; fi
      - name: Upload packaged smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-frozen-linux
          path: smoke-frozen/
      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-linux
          path: dist/qitv-linux
      - name: Cancel the run after a failure
        # A failed job cancels the others: the run cannot release anyway, and a fix pushed
        # next does not wait for it (main's runs queue instead of replacing each other).
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Get latest VLC version
        id: vlc-version
        continue-on-error: true  # the package feed may be down: VideoLAN's build then
        shell: powershell
        run: |
          $info = choco info vlc --limit-output
          $version = ($info -split '\|')[1]
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Cache VLC installer
        id: vlc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vlc-cache
          key: vlc-windows-${{ steps.vlc-version.outputs.version }}
      - name: Install VLC using Chocolatey
        # Chocolatey's community feed is down at times (503): the next step installs VLC's
        # own build from VideoLAN then.
        continue-on-error: true
        run: choco install vlc -y --cache-location=C:\vlc-cache
      - name: Install VLC from VideoLAN when Chocolatey could not
        shell: pwsh
        env:
          VLC_FALLBACK: 3.0.24  # VideoLAN's Windows build, checked against its published SHA-256
        run: |
          $dir = 'C:\Program Files\VideoLAN\VLC'
          if (Test-Path "$dir\plugins") { echo "VLC is installed"; exit 0 }
          $ProgressPreference = 'SilentlyContinue'
          $name = "vlc-$env:VLC_FALLBACK-win64.zip"
          $base = "https://download.videolan.org/pub/videolan/vlc/$env:VLC_FALLBACK/win64"
          $zip = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest "$base/$name" -OutFile $zip
          # The checksum file comes as bytes (application/octet-stream): read it from disk.
          Invoke-WebRequest "$base/$name.sha256" -OutFile "$zip.sha256"
          $want = ((Get-Content "$zip.sha256" -Raw).Trim() -split '\s+')[0]
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "The VLC download ($got) does not match VideoLAN's checksum ($want)" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'vlc')
          New-Item -ItemType Directory -Force -Path (Split-Path $dir) | Out-Null
          Move-Item (Join-Path $env:RUNNER_TEMP "vlc\vlc-$env:VLC_FALLBACK") $dir
          if (-not (Test-Path "$dir\libvlc.dll")) { throw "VLC is not where the build looks for it" }
          echo "VLC $env:VLC_FALLBACK installed from VideoLAN"
      - name: Sync dependencies
        id: sync
        run: uv sync --frozen --dev
      - name: Write the build's keys
        # services/_build_keys.py gets the OpenSubtitles key and the TMDB token from the
        # secrets, never printed; without a secret (a fork) its key stays empty. Nothing here
        # commits them.
        run: uv run python scripts/write_build_keys.py
        env:
          QITV_OPENSUBTITLES_KEY: ${{ secrets.QITV_OPENSUBTITLES_KEY }}
          QITV_TMDB_TOKEN: ${{ secrets.QITV_TMDB_TOKEN }}
      - name: Package App with PyInstaller for Windows
        id: package
        run: uv run pyinstaller qitv-windows.spec
      - name: Rename binary
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: ren dist\qitv.exe qitv-windows.exe
      - name: Hide the system VLC from the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # The app ships its own libVLC: its smoke must pass with no VLC installed.
        shell: pwsh
        run: Rename-Item -Path "C:\Program Files\VideoLAN" -NewName "VideoLAN.hidden"
      - name: Smoke test the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # A windowed app: the shell would not wait for it, and it has no console (its logs
        # are in smoke-frozen). Its exit code is the smoke test's.
        shell: pwsh
        run: |
          $smoke = Start-Process -FilePath dist\qitv-windows.exe -PassThru -ArgumentList @(
            "--smoke", "--out", "$PWD\smoke-frozen", "--pipeline", "--pip", "--fixtures", "$PWD\tests\fixtures")
          $null = $smoke.Handle  # keeps the exit code readable once it exits
          $smoke.WaitForExit()
          Get-Content -Path smoke-frozen\runner.log -ErrorAction SilentlyContinue
          exit $smoke.ExitCode
        timeout-minutes: 8
        env:
          QITV_SMOKE: '1'
      - name: Restore the system VLC
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\VideoLAN.hidden") {
            Rename-Item -Path "C:\Program Files\VideoLAN.hidden" -NewName "VideoLAN"
          }
      - name: Upload packaged smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-frozen-windows
          path: smoke-frozen/
      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-windows
          path: dist/qitv-windows.exe
      - name: Cancel the run after a failure
        # A failed job cancels the others: the run cannot release anyway, and a fix pushed
        # next does not wait for it (main's runs queue instead of replacing each other).
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  build-macos-universal:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Get latest VLC version
        id: vlc-version
        run: |
          VLC_VERSION=$(brew info --json=v2 --cask vlc | python3 -c "import sys,json; print(json.load(sys.stdin)['casks'][0]['version'])")
          echo "version=$VLC_VERSION" >> $GITHUB_OUTPUT
      - name: Cache VLC.app
        id: vlc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Applications/VLC.app
          key: vlc-macos-arm64-${{ steps.vlc-version.outputs.version }}
      - name: Install VLC
        if: steps.vlc-cache.outputs.cache-hit != 'true'
        run: brew install --cask vlc
      - name: Sync dependencies
        id: sync
        run: uv sync --frozen --dev
      - name: Write the build's keys
        # services/_build_keys.py gets the OpenSubtitles key and the TMDB token from the
        # secrets, never printed; without a secret (a fork) its key stays empty. Nothing here
        # commits them.
        run: uv run python scripts/write_build_keys.py
        env:
          QITV_OPENSUBTITLES_KEY: ${{ secrets.QITV_OPENSUBTITLES_KEY }}
          QITV_TMDB_TOKEN: ${{ secrets.QITV_TMDB_TOKEN }}
      - name: Package App with PyInstaller for macOS
        id: package
        run: uv run pyinstaller qitv-macos.spec
      - name: Ad-Hoc Sign the app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          codesign --force --deep --sign - dist/qitv.app
          # PyInstaller and the signature above rewrote every plugin, so the plugins.dat copied
          # from VLC.app no longer matches them and libVLC would load all ~340 plugins at every
          # start (macOS checks each one on a fresh download's first start). Write the cache
          # again with the bundle's own libVLC (VLC 3's vlc-cache-gen is libvlc_new with
          # --reset-plugins-cache), sign that file again, and re-seal the bundle without
          # touching its binaries (a --deep re-sign would make the cache stale again).
          uv run python -c "from services.vlc_bundle import use_bundled_vlc; assert use_bundled_vlc(top='dist/QiTV.app/Contents/Frameworks', system='Darwin'); import vlc; vlc.Instance(['--reset-plugins-cache', '--quiet']).release()"
          codesign --force --sign - dist/QiTV.app/Contents/Frameworks/vlc/plugins/plugins.dat
          codesign --force --sign - dist/qitv.app
          codesign --verify --deep --strict dist/qitv.app
      - name: Hide the system VLC from the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # The app ships its own libVLC: its smoke must pass with no VLC installed.
        run: sudo mv /Applications/VLC.app "$RUNNER_TEMP/VLC.app"
      - name: Smoke test the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # The same scenario through main.py's --smoke entry: the live helper must spawn from
        # the bundle, and libVLC and its plugins must load from it. The fixtures come from
        # the checkout; the app has none.
        run: dist/QiTV.app/Contents/MacOS/QiTV --smoke --out smoke-frozen --pipeline --pip --fixtures tests/fixtures
        timeout-minutes: 8
        env:
          QITV_SMOKE: '1'
      - name: The packaged app's plugin cache is current
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          grep -q "loading plugins cache file .*/Contents/Frameworks/vlc/plugins/plugins.dat" smoke-frozen/libvlc.log
          if grep -m5 "stale plugins cache" smoke-frozen/libvlc.log; then
            echo "::error::libVLC found the bundle's plugins.dat stale"; exit 1
          fi
      - name: Restore the system VLC
        if: always()
        run: if [ -d "$RUNNER_TEMP/VLC.app" ]; then sudo mv "$RUNNER_TEMP/VLC.app" /Applications/VLC.app; fi
      - name: Upload packaged smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-frozen-macos-arm
          path: smoke-frozen/
      - name: Zip macOS App
        # ditto keeps the bundle's symlinks, which its signature seals (zip -r copies them).
        run: cd dist && ditto -c -k --keepParent qitv.app qitv-macos-universal.zip
      - name: Make the macOS disk image
        # QiTV.app beside a shortcut to Applications, in a window drawn for dragging it there
        # (scripts/make_dmg.py, headless: dmgbuild writes the window's layout itself). ditto
        # copies the bundle with its symlinks, so the signature still seals it.
        run: |
          for attempt in 1 2 3; do
            # A runner's hdiutil sometimes answers "Resource busy" at first.
            uv run python scripts/make_dmg.py dist/QiTV.app dist/qitv-macos-universal.dmg && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
      - name: Check the macOS disk image
        run: |
          volume="$RUNNER_TEMP/dmg-volume"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$volume" dist/qitv-macos-universal.dmg
          codesign --verify --deep --strict "$volume/QiTV.app"
          test "$(readlink "$volume/Applications")" = /Applications
          # The window's layout and its background.
          test -s "$volume/.DS_Store" && test -s "$volume/.background.tiff"
          hdiutil detach "$volume"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-macos-universal
          path: |
            dist/qitv-macos-universal.zip
            dist/qitv-macos-universal.dmg
      - name: Cancel the run after a failure
        # A failed job cancels the others: the run cannot release anyway, and a fix pushed
        # next does not wait for it (main's runs queue instead of replacing each other).
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  build-macos-intel:
    runs-on: macos-15-intel
