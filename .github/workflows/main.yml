name: Build and verify

on:
  push:
    branches:
      - main
      - tv/vlc
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install VLC and xcb dependencies
        run: sudo apt-get update && sudo apt-get install -y vlc libxcb-cursor0 xvfb openbox xcompmgr x11-utils
      - name: Silence ALSA
        run: |
          printf 'pcm.!default { type null }\n' > ~/.asoundrc
      - name: Sync dependencies
        id: sync
        run: uv sync --frozen --dev
      - name: Run tests
        timeout-minutes: 20
        id: tests
        run: uv run python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Smoke test
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # openbox handles fullscreen and minimize; xcompmgr makes the overlays translucent.
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" sh -c '
            openbox &
            xcompmgr &
            for i in $(seq 50); do
              xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id" && break
              sleep 0.2
            done
            if ! xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then
              echo "openbox did not start"
              exit 1
            fi
            uv run python scripts/smoke_tv.py --out smoke-out --pipeline --pip
          '
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: xcb
      - name: Upload smoke results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-linux
          path: smoke-out/
      - name: Package App with PyInstaller for Linux
        id: package
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: uv run pyinstaller qitv-linux.spec
      - name: Rename binary
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: mv dist/qitv dist/qitv-linux
      - name: Smoke test the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # The same scenario through main.py's --smoke entry: the live helper must spawn from
        # the bundle. The fixtures come from the checkout; the app has none.
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" sh -c '
            openbox &
            xcompmgr &
            for i in $(seq 50); do
              xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id" && break
              sleep 0.2
            done
            if ! xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then
              echo "openbox did not start"
              exit 1
            fi
            dist/qitv-linux --smoke --out smoke-frozen --pipeline --pip --fixtures tests/fixtures
          '
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: xcb
          QITV_SMOKE: '1'
      - name: Upload packaged smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-frozen-linux
          path: smoke-frozen/
      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-linux
          path: dist/qitv-linux

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Get latest VLC version
        id: vlc-version
        shell: powershell
        run: |
          $info = choco info vlc --limit-output
          $version = ($info -split '\|')[1]
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Cache VLC installer
        id: vlc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vlc-cache
          key: vlc-windows-${{ steps.vlc-version.outputs.version }}
      - name: Install VLC using Chocolatey
        run: choco install vlc -y --cache-location=C:\vlc-cache
      - name: Sync dependencies
        id: sync
        run: uv sync --frozen --dev
      - name: Run tests
        timeout-minutes: 20
        id: tests
        # Qt's offscreen plugin on Windows reads fonts only from QT_QPA_FONTDIR (the PySide6
        # wheel ships none), so without it every glyph is a box as wide as the pixel size.
        run: |
          $fonts = @(Get-ChildItem -Path $env:QT_QPA_FONTDIR -Filter *.ttf -ErrorAction Stop)
          if ($fonts.Count -eq 0) { throw "No TrueType fonts in $env:QT_QPA_FONTDIR" }
          Write-Host "$($fonts.Count) TrueType fonts in $env:QT_QPA_FONTDIR"
          uv run python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
      - name: Smoke test
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/smoke_tv.py --out smoke-out --pipeline --pip
        timeout-minutes: 8
      - name: Upload smoke results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-windows
          path: smoke-out/
      - name: Package App with PyInstaller for Windows
        id: package
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: uv run pyinstaller qitv-windows.spec
      - name: Rename binary
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: ren dist\qitv.exe qitv-windows.exe
      - name: Smoke test the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # A windowed app: the shell would not wait for it, and it has no console (its logs
        # are in smoke-frozen). Its exit code is the smoke test's.
        shell: pwsh
        run: |
          $smoke = Start-Process -FilePath dist\qitv-windows.exe -PassThru -ArgumentList @(
            "--smoke", "--out", "$PWD\smoke-frozen", "--pipeline", "--pip", "--fixtures", "$PWD\tests\fixtures")
          $null = $smoke.Handle  # keeps the exit code readable once it exits
          $smoke.WaitForExit()
          Get-Content -Path smoke-frozen\runner.log -ErrorAction SilentlyContinue
          exit $smoke.ExitCode
        timeout-minutes: 8
        env:
          QITV_SMOKE: '1'
      - name: Upload packaged smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-frozen-windows
          path: smoke-frozen/
      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-windows
          path: dist/qitv-windows.exe

  build-macos-universal:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Get latest VLC version
        id: vlc-version
        run: |
          VLC_VERSION=$(brew info --json=v2 --cask vlc | python3 -c "import sys,json; print(json.load(sys.stdin)['casks'][0]['version'])")
          echo "version=$VLC_VERSION" >> $GITHUB_OUTPUT
      - name: Cache VLC.app
        id: vlc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Applications/VLC.app
          key: vlc-macos-arm64-${{ steps.vlc-version.outputs.version }}
      - name: Install VLC
        if: steps.vlc-cache.outputs.cache-hit != 'true'
        run: brew install --cask vlc
      - name: Sync dependencies
        id: sync
        run: uv sync --frozen --dev
      - name: Run tests
        timeout-minutes: 20
        id: tests
        run: uv run python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          QITV_GUI_TESTS: '1'  # tests that show real windows (a GUI session)
      - name: Smoke test
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/smoke_tv.py --out smoke-out --pipeline --pip
        timeout-minutes: 8
      - name: Upload smoke results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-macos-arm
          path: smoke-out/
      - name: Package App with PyInstaller for macOS
        id: package
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: uv run pyinstaller qitv-macos.spec
      - name: Ad-Hoc Sign the app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          codesign --force --deep --sign - dist/qitv.app
          # PyInstaller and the signature above rewrote every plugin, so the plugins.dat copied
          # from VLC.app no longer matches them and libVLC would load all ~340 plugins at every
          # start (macOS checks each one on a fresh download's first start). Write the cache
          # again with the bundle's own libVLC (VLC 3's vlc-cache-gen is libvlc_new with
          # --reset-plugins-cache), sign that file again, and re-seal the bundle without
          # touching its binaries (a --deep re-sign would make the cache stale again).
          uv run python -c "from services.vlc_bundle import use_bundled_vlc; assert use_bundled_vlc(top='dist/QiTV.app/Contents/Frameworks', system='Darwin'); import vlc; vlc.Instance(['--reset-plugins-cache', '--quiet']).release()"
          codesign --force --sign - dist/QiTV.app/Contents/Frameworks/vlc/plugins/plugins.dat
          codesign --force --sign - dist/qitv.app
          codesign --verify --deep --strict dist/qitv.app
      - name: Hide the system VLC from the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # The app ships its own libVLC: its smoke must pass with no VLC installed.
        run: sudo mv /Applications/VLC.app "$RUNNER_TEMP/VLC.app"
      - name: Smoke test the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # The same scenario through main.py's --smoke entry: the live helper must spawn from
        # the bundle, and libVLC and its plugins must load from it. The fixtures come from
        # the checkout; the app has none.
        run: dist/QiTV.app/Contents/MacOS/QiTV --smoke --out smoke-frozen --pipeline --pip --fixtures tests/fixtures
        timeout-minutes: 8
        env:
          QITV_SMOKE: '1'
      - name: The packaged app's plugin cache is current
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          grep -q "loading plugins cache file .*/Contents/Frameworks/vlc/plugins/plugins.dat" smoke-frozen/libvlc.log
          if grep -m5 "stale plugins cache" smoke-frozen/libvlc.log; then
            echo "::error::libVLC found the bundle's plugins.dat stale"; exit 1
          fi
      - name: Restore the system VLC
        if: always()
        run: if [ -d "$RUNNER_TEMP/VLC.app" ]; then sudo mv "$RUNNER_TEMP/VLC.app" /Applications/VLC.app; fi
      - name: Upload packaged smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-frozen-macos-arm
          path: smoke-frozen/
      - name: Zip macOS App
        # ditto keeps the bundle's symlinks, which its signature seals (zip -r copies them).
        run: cd dist && ditto -c -k --keepParent qitv.app qitv-macos-universal.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-macos-universal
          path: dist/qitv-macos-universal.zip

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Get latest VLC version
        id: vlc-version
        run: |
          VLC_VERSION=$(brew info --json=v2 --cask vlc | python3 -c "import sys,json; print(json.load(sys.stdin)['casks'][0]['version'])")
          echo "version=$VLC_VERSION" >> $GITHUB_OUTPUT
      - name: Cache VLC.app
        id: vlc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Applications/VLC.app
          key: vlc-macos-intel-${{ steps.vlc-version.outputs.version }}
      - name: Install VLC
        if: steps.vlc-cache.outputs.cache-hit != 'true'
        run: brew install --cask vlc
      - name: Sync dependencies
        id: sync
        run: uv sync --frozen --dev
      - name: Run tests
        timeout-minutes: 20
        id: tests
        run: uv run python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          QITV_GUI_TESTS: '1'  # tests that show real windows (a GUI session)
      - name: Smoke test
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/smoke_tv.py --out smoke-out --pipeline --pip
        timeout-minutes: 8
      - name: Upload smoke results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-macos-intel
          path: smoke-out/
      - name: Package App with PyInstaller for macOS (Intel)
        id: package
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: uv run pyinstaller qitv-macos.spec
      - name: Ad-Hoc Sign the app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          codesign --force --deep --sign - dist/qitv.app
          # PyInstaller and the signature above rewrote every plugin, so the plugins.dat copied
          # from VLC.app no longer matches them and libVLC would load all ~340 plugins at every
          # start (macOS checks each one on a fresh download's first start). Write the cache
          # again with the bundle's own libVLC (VLC 3's vlc-cache-gen is libvlc_new with
          # --reset-plugins-cache), sign that file again, and re-seal the bundle without
          # touching its binaries (a --deep re-sign would make the cache stale again).
          uv run python -c "from services.vlc_bundle import use_bundled_vlc; assert use_bundled_vlc(top='dist/QiTV.app/Contents/Frameworks', system='Darwin'); import vlc; vlc.Instance(['--reset-plugins-cache', '--quiet']).release()"
          codesign --force --sign - dist/QiTV.app/Contents/Frameworks/vlc/plugins/plugins.dat
          codesign --force --sign - dist/qitv.app
          codesign --verify --deep --strict dist/qitv.app
      - name: Hide the system VLC from the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # The app ships its own libVLC: its smoke must pass with no VLC installed.
        run: sudo mv /Applications/VLC.app "$RUNNER_TEMP/VLC.app"
      - name: Smoke test the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        # The same scenario through main.py's --smoke entry: the live helper must spawn from
        # the bundle, and libVLC and its plugins must load from it. The fixtures come from
        # the checkout; the app has none.
        run: dist/QiTV.app/Contents/MacOS/QiTV --smoke --out smoke-frozen --pipeline --pip --fixtures tests/fixtures
        timeout-minutes: 8
        env:
          QITV_SMOKE: '1'
      - name: The packaged app's plugin cache is current
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          grep -q "loading plugins cache file .*/Contents/Frameworks/vlc/plugins/plugins.dat" smoke-frozen/libvlc.log
          if grep -m5 "stale plugins cache" smoke-frozen/libvlc.log; then
            echo "::error::libVLC found the bundle's plugins.dat stale"; exit 1
          fi
      - name: Restore the system VLC
        if: always()
        run: if [ -d "$RUNNER_TEMP/VLC.app" ]; then sudo mv "$RUNNER_TEMP/VLC.app" /Applications/VLC.app; fi
      - name: Upload packaged smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-frozen-macos-intel
          path: smoke-frozen/
      - name: Zip macOS App
        # ditto keeps the bundle's symlinks, which its signature seals (zip -r copies them).
        run: cd dist && ditto -c -k --keepParent qitv.app qitv-macos-intel.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-macos-intel
          path: dist/qitv-macos-intel.zip

  release:
    needs: [build-linux, build-windows, build-macos-universal, build-macos-intel]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get Version
        id: get_version
        run: |
          version=$(python3 -c "
          import tomllib
          with open('pyproject.toml','rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body: |
            > **Please always download this free software from [Releases](https://github.com/ozankaraali/QiTV/releases) instead of using others' distributions, which may have malware. Always keep the [original repository](https://github.com/ozankaraali/QiTV) as reference.**
          generate_release_notes: true
          draft: false
          prerelease: true
          files: |
            packaged-app-linux/qitv-linux
            packaged-app-windows/qitv-windows.exe
            packaged-app-macos-universal/qitv-macos-universal.zip
            packaged-app-macos-intel/qitv-macos-intel.zip
