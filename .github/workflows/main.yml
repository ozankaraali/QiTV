        run: |
          for attempt in 1 2 3; do
            # A runner's hdiutil sometimes answers "Resource busy" at first.
            uv run python scripts/make_dmg.py dist/QiTV.app dist/qitv-macos-intel.dmg && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
      - name: Check the macOS disk image
        run: |
          volume="$RUNNER_TEMP/dmg-volume"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$volume" dist/qitv-macos-intel.dmg
          codesign --verify --deep --strict "$volume/QiTV.app"
          test "$(readlink "$volume/Applications")" = /Applications
          # The window's layout and its background.
          test -s "$volume/.DS_Store" && test -s "$volume/.background.tiff"
          hdiutil detach "$volume"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-macos-intel
          path: |
            dist/qitv-macos-intel.zip
            dist/qitv-macos-intel.dmg
      - name: Cancel the run after a failure
        # A failed job cancels the others: the run cannot release anyway, and a fix pushed
        # next does not wait for it (main's runs queue instead of replacing each other).
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    needs: [tests, build-linux, build-windows, build-macos-universal, build-macos-intel]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get Version
        id: get_version
        run: |
          version=$(python3 -c "
          import tomllib
          with open('pyproject.toml','rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body: |
            > **Please always download this free software from [Releases](https://github.com/ozankaraali/QiTV/releases) instead of using others' distributions, which may have malware. Always keep the [original repository](https://github.com/ozankaraali/QiTV) as reference.**
          generate_release_notes: true
          draft: false
          prerelease: true
          files: |
            packaged-app-linux/qitv-linux
            packaged-app-windows/qitv-windows.exe
            packaged-app-macos-universal/qitv-macos-universal.zip
            packaged-app-macos-intel/qitv-macos-intel.zip
            packaged-app-macos-universal/qitv-macos-universal.dmg
            packaged-app-macos-intel/qitv-macos-intel.dmg
